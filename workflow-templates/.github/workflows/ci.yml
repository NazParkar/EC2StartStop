name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3 pytest pytest-cov ruff black mypy types-boto3

    - name: Lint with Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        ruff check lambda.py --select=E9,F63,F7,F82 --target-version=py311
        # Check for other issues
        ruff check lambda.py --target-version=py311

    - name: Check code formatting with Black
      run: |
        black --check --diff lambda.py

    - name: Type check with mypy
      run: |
        mypy lambda.py --ignore-missing-imports || true

    - name: Run tests
      run: |
        # Add tests when available
        echo "No tests defined yet"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        bandit -r lambda.py -f json -o bandit-report.json || true
        bandit -r lambda.py

    - name: Check for known vulnerabilities
      run: |
        pip install boto3
        safety check --json || true

  validate-lambda:
    name: Validate Lambda Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Create Lambda package
      run: |
        mkdir -p package
        pip install boto3 -t package/
        cp lambda.py package/
        cd package
        zip -r ../lambda-test.zip .
        cd ..

    - name: Validate package
      run: |
        unzip -l lambda-test.zip
        test -f lambda-test.zip

    - name: Upload Lambda package
      uses: actions/upload-artifact@v4
      with:
        name: lambda-package-python-3.12
        path: lambda-test.zip
        retention-days: 7
